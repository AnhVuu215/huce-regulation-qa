services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      # Mô hình, embedding và câu trả lời đã cache; giữ lại giữa các lần chạy.
      - cache:/app/.cache
      # Log request và phản hồi của người dùng.
      - appdata:/app/.data

volumes:
  cache:
  appdata:
